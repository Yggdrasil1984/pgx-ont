resources: "config/resources.yaml"
samples: "samples.tsv"
units: "units.tsv"
output: "config/output_files.yaml"

default_container: "docker://hydragenetics/common:0.3.0"

reference:
  design_bed: "data/genomic_regions/exons_variants_pharmacogenomics_18_06_2019_ex_cyp2d6.bed"
  design_rsid: "data/genomic_regions/target_rsid.bed"
  fasta: "/data/ref_genomes/hg19/bwa/BWA_0.7.10_refseq/hg19.with.mt.fasta"
  fai: "/data/ref_genomes/hg19/bwa/BWA_0.7.10_refseq/hg19.with.mt.fai"
  dbsnp: "/data/ref_genomes/hg19/variation/dbsnp_138.vcf.gz"

trimmer_software: "fastp_pe"

bwa_mem:
  container: "docker://hydragenetics/bwa_mem:0.7.17"
  amb: "/data/ref_genomes/hg19/bwa/BWA_0.7.10_refseq/hg19.with.mt.amb"
  ann: "/data/ref_genomes/hg19/bwa/BWA_0.7.10_refseq/hg19.with.mt.ann"
  bwt: "/data/ref_genomes/hg19/bwa/BWA_0.7.10_refseq/hg19.with.mt.bwt"
  pac: "/data/ref_genomes/hg19/bwa/BWA_0.7.10_refseq/hg19.with.mt.pac"
  sa: "/data/ref_genomes/hg19/bwa/BWA_0.7.10_refseq/hg19.with.mt.sa"

bwa_mem_merge:
  extra: "-c -p"

fastp_pe:
  container: "docker://hydragenetics/fastp:0.20.1"

picard_mark_duplicates:
  container: "docker://hydragenetics/picard:2.25.0"

samtools_merge_bam:
  extra: "-c -p"

get_padded_bed:
  padding: 100

haplotypecaller:
  container: "docker://hydragenetics/gatk4:4.1.9.0"
  extra: "--dbsnp /data/ref_genomes/hg19/variation/dbsnp_138.vcf.gz --standard-min-confidence-threshold-for-calling 1.0"

snv_indels_haplotypecaller:
  container: "docker://hydragenetics/gatk4:4.1.9.0"

variant_filtration:
  read_ratio: 0.2
  read_depth: 100

variant_annotator:
  container: "docker://hydragenetics/gatk4:4.1.9.0"

detected_variants:
  file_type: "VCF"

sample_target_list:
  padding: 0

get_padded_baits:
  padding: 100
  file_format: "list"

depth_of_baits:
  container: "docker://hydragenetics/gatk4:4.1.9.0"
  extra: "--output-format TABLE"

depth_of_targets:
  container: "docker://hydragenetics/gatk4:4.1.9.0"
  extra: "--output-format TABLE"

append_id_to_gdf:
  file_type: "GDF"

get_clinical_guidelines:
  haplotype_definitions: "data/haplotypes/haplotype_definitions.csv"
  haplotype_activity: "data/guidelines/haplotype_activity_score.csv"
  clinical_guidelines: "data/guidelines/clinical_guidelines.csv"
  hidden_haplotypes: "data/haplotypes/hidden_haplotypes.csv"

get_interaction_guidelines:
  interaction_guidelines: "data/guidelines/interaction_guidelines.csv"

get_clinical_recommendations:
  analysed_variants: "config/templates/analysed_variants.txt"

generate_pgx_report:
  html_template: "config/templates/html_template.html"

# ── StarPhase CYP2D6 diplotyping ─────────────────────────────────────────────
starphase:
  enabled: false  # set true for runs with a haplotagged BAM + phased VCF
  container: "/path/to/starphase.sif"  # pbstarphase 1.5.0
  database: "/path/to/pbstarphase_20251002.json"  # pre-built, from the pb-StarPhase repo (data/)
  reference: "/path/to/GRCh38_chr.fasta"  # chr-prefixed GRCh38 with .fai, same as nallo
  bam_source: "pgx"  # "pgx" = this pipeline's BAM/VCF; "nallo" = nallo output (needs nallo_outdir); "custom" = per-sample paths in custom_inputs

# ── PharmCAT (needs starphase.enabled for the CYP2D6 outside call) ───────────
pharmcat:
  enabled: false
  container: "/path/to/pharmcat_3.4.0.sif"  # docker://pgkb/pharmcat:3.4.0
  outside_call_genes: ["CYP2D6"]  # genes called by StarPhase instead of PharmCAT (clinical decision)
  swedish_guidelines: "/path/to/swedish_guidelines.tsv"  # outside the repo; format: config/templates/swedish_guidelines.example.tsv
  guideline_sources: ["CPIC", "DPWG"]  # English text sources shown where no Swedish text matches

# ── Read depth per panel target (colour scale in the report) ─────────────────
panel_coverage:
  enabled: false
  target_bed: "/path/to/panel_targets.bed"  # BED4, name = GENE or GENE|rsID
  clinical_positions: "pharmcat"  # colour follows these positions inside a target; "pharmcat" = generated from the PharmCAT container
  samtools: "/usr/bin/samtools"  # the pgx conda env has an ancient samtools
  min_mapq: 0  # 0 = count all reads (mosdepth default)
  thresholds:  # lower limits for [green, pale green, orange, red]; 0 reads = black
    ONT: [100, 50, 30, 1]  # decided by Lars-Ola 2026-10-20
    PACBIO: [41, 20, 10, 1]  # HiFi, decided by Lars-Ola 2026-10-27: <10 failed, 10-19 warning, 20-40 pass, >40 over-sequenced

# ── PharmCAT positions outside the enriched panel region ─────────────────────
off_target:
  enabled: false  # needs pharmcat, panel_coverage, reference_calls; nallo snv_call_regions widened (config/nallo/pad_bed.py)
  enriched_pad: 500  # targets +/- this many bp count as enriched and go to PharmCAT; the rest is listed separately (Lars-Ola 2026-10-28)

# ── Plain SNP genotypes with HGVS for markers outside PharmCAT ───────────────
snp_markers:
  enabled: false
  table: "/path/to/snp_markers.tsv"  # DRAFT, outside the repo; needs panel_coverage

# ── Reference genotypes from nallo's gVCF (PharmCAT + SNP section) ───────────
reference_calls:
  enabled: false  # needs starphase.bam_source: nallo and nallo run with the gVCF publishDir config
  positions: ["pharmcat"]  # BEDs; "pharmcat" = generated from the PharmCAT container; SNP markers added automatically
  read_rule:  # where the caller is unsure: reference if >= min_fraction of >= min_reads reads are normal (Lars-Ola 2026-10-27)
    enabled: true
    min_reads: 30
    min_fraction: 0.95
    min_mapq: 5  # same as DeepVariant's default
